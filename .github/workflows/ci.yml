name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake
      - name: Configure
        run: cmake -S firmware -B build -DCMAKE_TOOLCHAIN_FILE="$PWD/firmware/cmake/arm-none-eabi.cmake"
      - name: Build
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/firmware.elf
            build/firmware.bin
            build/firmware.map

  simulator-tests:
    name: Tests against the simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --dut sim --junitxml=reports/sim.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-test-report
          path: reports/

  # Runs on the self-hosted runner on the Raspberry Pi (label "hil"), which
  # has the board attached over USB and wired to its GPIOs. Only pushes to
  # master reach it: pull requests from forks must never run code on the Pi.
  # Enabled by the repository variable HIL_RUNNER=true once the runner exists.
  hardware-tests:
    name: Tests on real hardware
    needs: [firmware, simulator-tests]
    if: vars.HIL_RUNNER == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, hil]
    concurrency: hil-board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-pi.txt
      - name: Flash and test
        run: .venv/bin/pytest --dut serial --port=/dev/ttyACM0 --gpio --flash=build/firmware.elf --junitxml=reports/hil.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-test-report
          path: reports/
